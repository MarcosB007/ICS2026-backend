name: Build, Test and Deploy to Azure App Service (Publish Profile)

on:
  push:
    branches: [development, main, test/US-24-evidencia-deploy-bloqueado]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: milagonz
  IMAGE_NAME: ics-backend

jobs:
  # ==================================================================
  # JOB 1: Quality Gate - Pruebas unitarias e de integracion
  # ==================================================================
  run-tests:
    name: Quality Gate - Pruebas Unitarias e Integracion
    runs-on: ubuntu-latest
    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Configurar SDK de .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 3. Restaurar dependencias
        run: dotnet restore Dsw2025Tpi.sln

      - name: 4. Compilar la solución
        run: dotnet build Dsw2025Tpi.sln --no-restore --configuration Release

      - name: 5. Ejecutar suite de pruebas (unitarias + integración)
        run: >
          dotnet test Dsw2025Tpi.sln
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=resultados.trx"
          --results-directory TestResults

      - name: 6. Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults

  # ==================================================================
  # JOB 2: Construcción Docker y despliegue a Azure
  # Solo se ejecuta si 'run-tests' termina con éxito
  # ==================================================================
  build-and-deploy:
    name: Build Docker y Deploy a Azure
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Construir la imagen Docker (.NET 8)
        run: |
          docker build \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
          -f Dockerfile \
          .

      - name: 4. Subir la imagen a Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: 5. Desplegar el contenedor en Azure App Service
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest